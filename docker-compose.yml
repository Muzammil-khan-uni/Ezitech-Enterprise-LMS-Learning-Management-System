# Usage (run from this folder, the one that contains both project folders):
#   ./setup-env.sh          (creates .env with random secrets; then edit the rest)
#   docker compose up -d --build
# Layout:
#   docker-compose.yml, .env, .env.example, setup-env.sh   <- here
#   ezitech-lms-server/
#   ezitech-lms-client/

services:
  client:
    build:
      context: ./ezitech-lms-client
      args:
        # Same-origin by default - the client's nginx proxies /api and
        # /socket.io to the api service (see nginx.conf), so the
        # browser never needs to know the API container's address.
        # Override only if the API is deliberately served from a
        # different public origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
    ports:
      - '${CLIENT_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: ./ezitech-lms-server
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # Credentials live in .env (see .env.example), not hardcoded here.
      # authSource=admin matches the root user created by the mongo
      # service's MONGO_INITDB_ROOT_* below.
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/ezitech_lms?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      - NODE_ENV=production
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - SERVER_PUBLIC_URL=${SERVER_PUBLIC_URL:-${CLIENT_ORIGIN:-http://localhost}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env}
      - SCORM_CONTENT_ORIGIN=${SCORM_CONTENT_ORIGIN:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    # No `ports:` - Mongo is reachable only from other services on the compose network.
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    # No `ports:` - same reasoning as mongo above.
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  mongo_data:
  redis_data:
